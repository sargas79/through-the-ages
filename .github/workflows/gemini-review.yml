name: Gemini PR Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Gemini AI Review
        uses: sshnaidm/gemini-code-review-action@v2
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          # Optional: Customize the focus of the review
          prompt: |
            Please review this code diff. Focus on:
            1. Potential security vulnerabilities
            2. Performance bottlenecks
            3. Readability and clean code principles
